services:
  postgres:
    image: postgres:16-alpine
    container_name: building-exterior-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-building_exterior}
      POSTGRES_USER: ${POSTGRES_USER:-building_exterior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-building_exterior_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-building_exterior} -d ${POSTGRES_DB:-building_exterior}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: building-exterior-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-building_exterior_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-building_exterior_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: building-exterior-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  algorithm-model:
    profiles: ["algorithm-gpu"]
    build:
      context: ./algorithm-model
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: building-exterior-algorithm-model:cuda
    container_name: building-exterior-algorithm-model
    restart: unless-stopped
    ipc: host
    environment:
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      MODEL_VERSION: ${MODEL_VERSION:-trial-crack-spalling-v1}
      CRACK_MODEL_WEIGHTS_PATH: ${CRACK_MODEL_WEIGHTS_PATH:-/models/wall_crack_yolo11x.pt}
      SPALLING_MODEL_WEIGHTS_PATH: ${SPALLING_MODEL_WEIGHTS_PATH:-/models/missing.pt}
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD:-0.25}
      MODEL_IMAGE_SIZE: ${MODEL_IMAGE_SIZE:-1280}
      MODEL_HIGH_PRECISION_IMAGE_SIZE: ${MODEL_HIGH_PRECISION_IMAGE_SIZE:-1280}
      MODEL_TILED_INFERENCE_ENABLED: ${MODEL_TILED_INFERENCE_ENABLED:-true}
      MODEL_TILE_SIZE: ${MODEL_TILE_SIZE:-1280}
      MODEL_HIGH_PRECISION_TILE_SIZE: ${MODEL_HIGH_PRECISION_TILE_SIZE:-1280}
      MODEL_TILE_OVERLAP_RATIO: ${MODEL_TILE_OVERLAP_RATIO:-0.25}
      MODEL_TILE_NMS_IOU_THRESHOLD: ${MODEL_TILE_NMS_IOU_THRESHOLD:-0.5}
      ULTRALYTICS_SETTINGS_DIR: /tmp/ultralytics
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "${ALGORITHM_MODEL_PORT:-9004}:9002"
    expose:
      - "9002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${ALGORITHM_GPU_COUNT:-1}
              capabilities: [gpu]

  algorithm-worker:
    profiles: ["worker"]
    build:
      context: ./algorithm-worker
    container_name: building-exterior-algorithm-worker
    environment:
      WORKER_BACKEND_BASE_URL: ${WORKER_CONTAINER_BACKEND_BASE_URL:-http://host.docker.internal}
      WORKER_ID: ${WORKER_ID:-mock-worker-compose}
      WORKER_TOKEN: ${WORKER_TOKEN:-change-this-worker-token}
      WORKER_MODEL_VERSION: ${WORKER_MODEL_VERSION:-trial-crack-spalling-v1}
      WORKER_MODE: ${WORKER_MODE:-mock}
      ALGORITHM_INFERENCE_URL: ${ALGORITHM_INFERENCE_URL:-http://algorithm-model:9002}
      ALGORITHM_INFERENCE_TIMEOUT_SECONDS: ${ALGORITHM_INFERENCE_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  minio_data:
  redis_data:
